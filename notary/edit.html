<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>번역본 확인 · 확정 — IUMM 공증</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/notary/notary.css?v=6">
<!-- ★메인·주문 페이지와 같은 v1 SDK. 편집토큰이 없을 때는 카카오 토큰으로 인증하는데,
     버전이 다르면 같은 로그인 상태인데도 토큰을 읽지 못한다. -->
<script src="https://t1.kakaocdn.net/kakao_js_sdk/v1/kakao.min.js"></script>
</head>
<body>

<nav class="ntr-nav no-print">
  <a href="/" class="logo">IUMM</a>
  <div class="right">
    <span id="ordno" style="color:var(--text-muted);font-size:13px"></span>
    <a href="/mypage">마이페이지</a>
  </div>
</nav>

<div class="ntr-wrap">

  <!-- 상태 -->
  <div class="ntr-card no-print" id="status-card">
    <h2 id="st-title"><span class="ntr-spinner"></span> 불러오는 중…</h2>
    <p class="hint" id="st-desc">잠시만 기다려 주세요.</p>
    <div id="st-extra"></div>
  </div>

  <!-- 편집 안내 -->
  <div class="ntr-card no-print" id="edit-guide" style="display:none">
    <h2>번역본을 확인해 주세요</h2>
    <p class="hint">
      <strong>색이 칠해진 부분만</strong> 직접 눌러 수정할 수 있습니다.
      표 구조·문구는 고정되어 있어 깨지지 않습니다.
      원본 값을 보려면 항목에 마우스를 올려 보세요.
    </p>
    <div class="ntr-legend">
      <span><i class="g"></i>수정 가능</span>
      <span><i class="y"></i>표기 확인 권장 (이름·지명 자동 음역)</span>
      <span><i class="r"></i>반드시 확인 (사전에 없거나 인식되지 않음)</span>
    </div>
    <div id="warn-box"></div>
  </div>

  <!-- 서류 -->
  <div class="ntr-paper" id="paper" style="display:none">
    <div id="doc"></div>
  </div>

  <!-- 하단 액션 -->
  <div class="ntr-card no-print" id="actions" style="display:none;margin-top:18px">
    <div class="ntr-note danger" id="confirm-warn">
      <strong>확정하면 더 이상 수정할 수 없습니다.</strong><br>
      이름 철자(여권 표기), 생년월일, 주민등록번호를 특히 꼼꼼히 확인해 주세요.
    </div>
    <label class="ntr-check" style="margin-top:14px">
      <input type="checkbox" id="final-ok"><span>모든 내용을 확인했으며, 확정 후 수정이 불가함에 동의합니다</span>
    </label>
    <button class="ntr-btn wide" id="confirmBtn" onclick="confirmDoc()" disabled>최종 확정하기</button>
    <div id="act-msg" class="ntr-msg"></div>
  </div>

  <!-- 발행 후 -->
  <div class="ntr-card no-print" id="done-box" style="display:none;margin-top:18px">
    <h2>발행 완료</h2>
    <div id="done-body"></div>
  </div>

</div>

<script>
var API = 'https://iumm-pipeline-production.up.railway.app';
var KAKAO_KEY = 'd37fe286e0256c9199a29236ed10c244';

var qs = new URLSearchParams(location.search);
var ORDER = qs.get('o') || '';
var TOKEN = qs.get('t') || '';
var STATE = null, POLLS = 0;

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function initKakao(){
  if (typeof Kakao === 'undefined') return false;
  if (!Kakao.isInitialized()) { try { Kakao.init(KAKAO_KEY); } catch(e){ return false; } }
  return true;
}
function kakaoToken(){
  try { initKakao(); return (Kakao.Auth && Kakao.Auth.getAccessToken) ? Kakao.Auth.getAccessToken() : null; }
  catch(e){ return null; }
}

/** 편집토큰이 있으면 쿼리로, 없으면 카카오 access_token 을 Bearer 로 */
async function api(path, opts){
  opts = opts || {};
  var url = API + path;
  var headers = opts.headers || {};
  if (TOKEN) {
    url += (url.indexOf('?')===-1?'?':'&') + 't=' + encodeURIComponent(TOKEN);
  } else {
    var tk = kakaoToken();
    if (!tk) throw new Error('NO_AUTH');
    headers['Authorization'] = 'Bearer ' + tk;
  }
  var r = await fetch(url, Object.assign({}, opts, { headers: headers }));
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) { var e = new Error(d.error || ('HTTP '+r.status)); e.status = r.status; e.data = d; throw e; }
  return d;
}

function setStatus(title, desc, extra){
  $('st-title').innerHTML = title;
  $('st-desc').textContent = desc || '';
  $('st-extra').innerHTML = extra || '';
}

// ─── 상태 폴링 ───────────────────────────────────────────
async function poll(){
  try {
    STATE = await api('/api/notary/order/' + encodeURIComponent(ORDER));
  } catch(e){
    if (e.message === 'NO_AUTH') {
      setStatus('로그인이 필요합니다', '카카오 로그인 후 마이페이지에서 다시 열어주세요.',
        '<button class="ntr-btn" onclick="location.href=\'/mypage\'">마이페이지로</button>');
      return;
    }
    if (e.status === 410 && e.data && e.data.expired) {
      setStatus('링크가 만료되었습니다', '로그인 후 마이페이지에서 다시 열면 새 링크가 발급됩니다.',
        '<button class="ntr-btn" onclick="location.href=\'/mypage\'">마이페이지로</button>');
      return;
    }
    setStatus('불러오지 못했습니다', e.message,
      '<button class="ntr-btn ghost" onclick="poll()">다시 시도</button>');
    return;
  }

  $('ordno').textContent = '주문 ' + STATE.orderNumber;
  var k = STATE.statusKey;

  if (k === 'processing') {
    POLLS++;
    setStatus('<span class="ntr-spinner"></span> ' + esc(STATE.statusLabel),
      '서류를 인식하고 번역하는 중입니다. 보통 1~3분 걸립니다. 이 창을 닫아도 마이페이지에서 이어서 진행할 수 있습니다.');
    if (POLLS < 100) setTimeout(poll, 5000);
    else setStatus('처리가 지연되고 있습니다', '담당자가 확인 중입니다. 잠시 후 마이페이지에서 확인해 주세요.');
    return;
  }
  if (k === 'failed') {
    setStatus('서류를 인식하지 못했습니다',
      '담당자가 확인 후 연락드립니다. 결제하신 건은 담당자 확인 후 처리됩니다.',
      '<div class="ntr-note danger">사유: ' + esc(STATE.failReason || '확인 중') +
      '<br>문의: iumm.master@gmail.com (주문번호 ' + esc(STATE.orderNumber) + ')</div>');
    return;
  }
  if (k === 'editing') { return loadDoc(false); }
  if (k === 'done')    { return loadDoc(true); }
}

// ─── 서류 로드 ───────────────────────────────────────────
async function loadDoc(finalized){
  var d;
  try { d = await api('/api/notary/order/' + encodeURIComponent(ORDER) + '/render'); }
  catch(e){ setStatus('번역본을 불러오지 못했습니다', e.message); return; }

  $('doc').innerHTML = d.html;
  $('paper').style.display = '';
  $('status-card').style.display = 'none';

  if (finalized || d.finalized) return showDone();

  document.body.classList.add('editing');
  $('edit-guide').style.display = '';
  $('actions').style.display = '';

  var warns = (d.warnings || []);
  $('warn-box').innerHTML = warns.length
    ? '<div class="ntr-note warn"><strong>확인이 필요한 사항</strong><ul>' +
      warns.map(function(w){ return '<li>'+esc(w)+'</li>'; }).join('') + '</ul></div>'
    : '';

  // 원본 대조 툴팁
  document.querySelectorAll('#doc [data-f]').forEach(function(el){
    var src = el.getAttribute('data-src');
    if (src) el.title = '원문: ' + src;
    // 붙여넣기는 평문만 (틀에 서식·태그가 섞이지 않게)
    el.addEventListener('paste', function(ev){
      ev.preventDefault();
      var t = (ev.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, String(t).replace(/\s+/g,' ').trim());
    });
    el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') ev.preventDefault(); });
  });

  $('final-ok').addEventListener('change', function(){
    $('confirmBtn').disabled = !this.checked;
  });

  window.addEventListener('beforeunload', function(ev){
    if (document.body.classList.contains('editing')) { ev.preventDefault(); ev.returnValue = ''; }
  });
}

// ─── 인쇄 머리글 억제 ────────────────────────────────────
// 브라우저 인쇄 머리글에는 document.title 이 찍힌다. 공증 서류에 사이트 제목이
// 남으면 안 되므로 인쇄 동안만 제목을 비운다. (여백은 @page margin:0 으로 이미
// 없앴다 — 크롬은 그릴 자리가 없으면 머리글·바닥글을 그리지 않는다.)
(function(){
  var savedTitle = '';
  window.addEventListener('beforeprint', function(){
    savedTitle = document.title; document.title = ' ';
  });
  window.addEventListener('afterprint', function(){
    if (savedTitle) document.title = savedTitle;
  });
})();

/** 인쇄 안내 — CSS 로 못 막는 브라우저를 위해 한 번 더 알려준다 */
var PRINT_TIP =
  '<div class="ntr-note warn">' +
  '<strong>인쇄·PDF 저장 전에 확인해 주세요</strong><ul>' +
  '<li>인쇄 대화상자에서 <strong>“머리글 및 바닥글”</strong> 체크를 <strong>해제</strong>하세요. ' +
  '날짜·문서 제목·주소(URL)가 공증 서류에 찍히는 것을 막습니다.</li>' +
  '<li>PDF로 저장하려면 <strong>대상</strong>을 “PDF로 저장”으로 선택하세요.</li>' +
  '<li>여백은 <strong>“기본값”</strong>을 그대로 두세요.</li>' +
  '</ul></div>';

// ─── 확정 ────────────────────────────────────────────────
async function confirmDoc(){
  var btn = $('confirmBtn');
  btn.disabled = true;
  $('act-msg').className = 'ntr-msg';
  $('act-msg').innerHTML = '<span class="ntr-spinner"></span> 확정하는 중…';

  // ★HTML이 아니라 값 맵만 보낸다. 서버가 틀을 다시 조립한다.
  var fields = {};
  document.querySelectorAll('#doc [data-f]').forEach(function(el){
    fields[el.getAttribute('data-f')] = (el.textContent || '').replace(/\s+/g,' ').trim();
  });

  try {
    var d = await api('/api/notary/order/' + encodeURIComponent(ORDER) + '/confirm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fields: fields })
    });
    document.body.classList.remove('editing');
    $('doc').innerHTML = d.html;
    STATE = Object.assign({}, STATE, {
      tier: d.tier, statusKey: 'done', statusLabel: '발행 완료',
      deleteDate: d.deleteDate || STATE.deleteDate
    });
    showDone();
  } catch(e){
    btn.disabled = false;
    $('act-msg').className = 'ntr-msg err';
    $('act-msg').innerHTML = '확정 실패: ' + esc(e.message);
  }
}

// ─── 발행 후 ─────────────────────────────────────────────
function showDone(){
  document.body.classList.remove('editing');
  $('edit-guide').style.display = 'none';
  $('actions').style.display = 'none';
  $('status-card').style.display = 'none';
  $('done-box').style.display = '';

  var tier = (STATE && STATE.tier) || '';
  var html = '';

  if (tier === 'T1') {
    html =
      '<p class="hint">아래 버튼으로 인쇄하거나 PDF로 저장하세요.</p>' +
      PRINT_TIP +
      '<button class="ntr-btn wide" style="margin-top:14px" onclick="window.print()">인쇄 · PDF로 저장</button>';
  } else {
    html =
      '<p class="hint">확정이 완료되어 담당자에게 전달되었습니다.</p>' +
      '<div class="ntr-note">' +
      '· 번역자격인증 · 공증 절차가 진행됩니다.<br>' +
      '· 완료되면 등기로 발송하고 스캔본을 보내드립니다.<br>' +
      (tier === 'T3' ? '· 아포스티유까지 함께 진행됩니다.<br>' : '') +
      '· 진행 상황은 마이페이지에서 확인할 수 있습니다.' +
      '</div>' + PRINT_TIP +
      '<button class="ntr-btn wide ghost" style="margin-top:14px" onclick="window.print()">번역본 인쇄 (참고용)</button>';
  }

  if (STATE && STATE.deleteDate) {
    var dd = new Date(STATE.deleteDate);
    if (!isNaN(dd)) {
      html += '<div class="ntr-note" style="margin-top:14px">' +
        '🔒 <strong>' + dd.getFullYear() + '.' + (dd.getMonth()+1) + '.' + dd.getDate() + ' 자동 삭제</strong><br>' +
        '개인정보 보호를 위해 발행 후 30일이 지나면 원본·번역본·개인정보가 서버에서 완전히 삭제됩니다. ' +
        '기간 내에 저장해 주세요.</div>';
    }
  }
  html += '<div style="margin-top:14px"><a href="/mypage">← 마이페이지로</a></div>';
  $('done-body').innerHTML = html;
}

// ─── 시작 ────────────────────────────────────────────────
if (!ORDER) {
  setStatus('주문번호가 없습니다', '마이페이지에서 주문을 선택해 주세요.',
    '<button class="ntr-btn" onclick="location.href=\'/mypage\'">마이페이지로</button>');
} else {
  $('ordno').textContent = '주문 ' + ORDER;
  poll();
}
</script>
</body>
</html>
